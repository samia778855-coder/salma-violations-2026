<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رصد مخالفة</title><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"></head><body><header class="topbar"><div><h1>{{system_name}}</h1><p>{{system_subtitle}} — بوابة المعلمات</p></div><a class="btn btn-danger" href="{{url_for('teacher_logout')}}">خروج</a></header><main class="container"><section class="section"><h2>📝 إرسال بلاغ مخالفة للإدارة</h2><p>لا يُحتسب البلاغ مخالفة رسمية إلا بعد مراجعة الإدارة واعتماده.</p>{% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<form method="post" action="{{url_for('teacher_submit')}}"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label>اسم المعلمة</label><input name="teacher_name" required maxlength="150" placeholder="اسم المعلمة"><label>الصف / الشعبة</label><select id="classFilter"><option value="">كل الصفوف</option>{% for c in classes %}<option value="{{c}}">{{c}}</option>{% endfor %}</select><label>ابحثي عن الطالبة</label><input id="searchStudent" placeholder="اكتبي جزءًا من الاسم" autocomplete="off"><label>اسم الطالبة</label><select id="studentSelect" name="student_id" required><option value="">اختاري الطالبة</option>{% for st in students %}<option value="{{st.id}}" data-class="{{st.class_name}}">{{st.student_name}} — {{st.class_name}}</option>{% endfor %}</select><label>نوع المخالفة</label><select name="violation_id" required><option value="">اختاري البند</option>{% for v in violations %}<option value="{{v.id}}">{{v.title}} ({{level_labels[v.base_level]}})</option>{% endfor %}</select><label>وصف المخالفة (اختياري)</label><textarea name="note" maxlength="2000" rows="3"></textarea><button type="submit" class="btn btn-primary" onclick="return confirm('إرسال البلاغ لإدارة المدرسة؟')">📨 إرسال للإدارة</button></form></section></main><script>const cl=document.getElementById('classFilter'),q=document.getElementById('searchStudent'),sel=document.getElementById('studentSelect');function filt(){const cls=cl.value,txt=q.value.trim().toLowerCase();for(const o of sel.options){if(!o.value)continue;o.hidden=!!((cls&&o.dataset.class!==cls)||(txt&&!o.textContent.toLowerCase().includes(txt)));}if(sel.selectedOptions[0]?.hidden)sel.value='';}cl.addEventListener('change',filt);q.addEventListener('input',filt);</script></body></html>
