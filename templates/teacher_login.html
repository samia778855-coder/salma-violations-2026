<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول المعلمات</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body class="login-page"><div class="login-container"><div class="login-card"><h1>{{ system_name }}</h1><h2 class="system-title">👩‍🏫 بوابة رصد المخالفات للمعلمات</h2><p>تُرسل البلاغات للإدارة ولا تُعتمد تلقائيًا.</p>{% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>رمز دخول المعلمات</label><input type="password" name="code" required autocomplete="off"><button class="btn btn-primary">دخول</button></form><p><a href="{{url_for('login')}}">العودة إلى دخول الإدارة</a></p></div></div></body></html>
